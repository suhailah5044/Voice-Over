<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --navy: #071a44;
        --biru: #0d3aa8;
        --merah: #d7141a;
        --emas: #f5b800;
        --putih: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--navy);
      }
      #root { position: relative; width: 100%; height: 100%; }
      /* Wartawan cutout: an untimed wrapper carries the framing and punch-ins. */
      #bingkai {
        position: absolute;
        inset: 0;
        z-index: 3;
        transform-origin: 50% 100%;
      }
      #wartawan {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      /* Warm haze wash so the indoor-lit child sits in the smoky scene. */
      #wash {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 150, 70, 0.0) 30%, rgba(255, 140, 60, 0.10) 70%, rgba(80, 40, 20, 0.28) 100%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="63.4" data-width="1080" data-height="1920">
      <!-- 1. Pembuka: news opening -->
      <div id="pembuka" data-composition-id="pembuka" data-composition-src="compositions/pembuka.html"
        data-start="0" data-duration="6.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 9"></div>

      <!-- 2. Latar jerebu behind the reporter -->
      <div id="latar" data-composition-id="latar" data-composition-src="compositions/latar.html"
        data-start="5.6" data-duration="53.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- 3. Reporter cutout -->
      <div id="bingkai">
        <video id="wartawan" class="clip" src="assets/wartawan-cutout.webm" muted playsinline
          data-start="6" data-duration="52.9" data-media-start="0" data-track-index="3"
          data-layout-allow-occlusion></video>
      </div>
      <div id="wash"></div>

      <!-- 4. News graphics (bugs, lower thirds, fact cards, ticker) -->
      <div id="grafik" data-composition-id="grafik" data-composition-src="compositions/grafik.html"
        data-start="6" data-duration="52.9" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- 5. Captions -->
      <div id="kapsyen" data-composition-id="kapsyen" data-composition-src="compositions/kapsyen.html"
        data-start="6" data-duration="52.9" data-track-index="5" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 7"></div>

      <!-- 6. Penutup: closing card -->
      <div id="penutup" data-composition-id="penutup" data-composition-src="compositions/penutup.html"
        data-start="58.6" data-duration="4.8" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 9"></div>

      <!-- Audio -->
      <audio id="sting-buka" class="clip" src="assets/intro-sting.wav" data-start="0" data-duration="6" data-volume="0.9" data-track-index="7"></audio>
      <audio id="suara" class="clip" src="assets/suara.wav" data-start="6" data-duration="52.9" data-volume="1" data-track-index="8"></audio>
      <audio id="muzik-latar" class="clip" src="assets/news-bed.wav" data-start="5.6" data-duration="53.2" data-volume="0.13" data-fade-in="1" data-fade-out="1" data-track-index="9"></audio>
      <audio id="sting-tutup" class="clip" src="assets/outro-sting.wav" data-start="58.8" data-duration="4.5" data-volume="0.9" data-track-index="10"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Framing: reporter sits low so the top band is free for news graphics.
      const BASE = 0.9;
      tl.set("#bingkai", { scale: BASE, y: 40 }, 0);
      tl.fromTo("#wash", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 6);
      // Alternate a gentle punch-in at every jump cut so the cuts read as camera changes.
      const cuts = [0, 4.89, 7.96, 9.9, 12.25, 18.2, 19.47, 24.86, 27.23, 29.19, 33.71, 34.23, 38.21, 39.82, 40.21, 42.73, 44.69, 46.34, 49.64];
      const plan = [1, 1.08, 1, 1.08, 1, 1.06, 1, 1, 1.08, 1, 1.08, 1.08, 1, 1.08, 1.08, 1, 1.08, 1, 1.08];
      cuts.forEach((c, i) => {
        const s = BASE * plan[i];
        tl.set("#bingkai", { scale: s, y: plan[i] > 1 ? 120 : 40 }, 6 + c);
        // slow push so each shot breathes
        const next = i + 1 < cuts.length ? cuts[i + 1] : 52.9;
        tl.to("#bingkai", { scale: s * 1.015, duration: Math.max(0.2, next - c - 0.02), ease: "none" }, 6 + c);
      });
      tl.to("#wash", { opacity: 0, duration: 0.4 }, 58.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
